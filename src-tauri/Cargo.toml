[package]
name = "duanyan-ide"
version = "1.2.0"
edition = "2021"
authors = ["Zhujun"]
description = "DUANYAN IDE - The Duanyan Development Environment"
# 多 binary 包(flash_test/js2bin/reset_boot 为工具), tauri dev 需指定主程序
default-run = "duanyan-ide"

[lib]
name = "duanyan_ide_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.2", optional = true }
espflash = { version = "4", features = ["serialport"] }
hardyscript = { path = "../../HardyScript", features = ["domains"] }  # IDE 的行业分析功能需要垂直域模块
duanyan = { path = "../../DUANYAN", features = ["std", "full"] }  # IDE 需要 copilot/smart_gen/ide_intelligence 等 full 模块

[features]
default = ["bridge_serial"]
bridge_serial = ["serialport"]
