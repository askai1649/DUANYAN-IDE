[package]
name = "snar-ide"
version = "1.2.0"
edition = "2021"
authors = ["Zhujun"]
description = "SNAR IDE - The Snare Development Environment"

[lib]
name = "snar_ide_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.2", optional = true }
snarjs = { path = "../../SNARjs" }
qianlu = { path = "../../qianlu", default-features = false }

[features]
default = []
bridge_serial = ["serialport"]
